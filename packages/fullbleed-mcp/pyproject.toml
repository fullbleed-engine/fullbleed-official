[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fullbleed-mcp"
version = "0.1.0"
description = "First-party MCP stdio tools for deterministic document generation with Fullbleed PDF Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fullbleed Engine contributors"}]
keywords = [
    "mcp",
    "model-context-protocol",
    "pdf-generation",
    "document-generation",
    "ai-agents",
    "fullbleed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["fullbleed>=2.3.0,<3"]

[project.scripts]
fullbleed-mcp = "fullbleed_mcp:main"

[project.urls]
Homepage = "https://fullbleed.dev"
Repository = "https://github.com/fullbleed-engine/fullbleed-official"
Documentation = "https://github.com/fullbleed-engine/fullbleed-official/tree/master/packages/fullbleed-mcp"
MCP-Registry = "https://registry.modelcontextprotocol.io/?q=fullbleed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.fullbleed-mcp.registry]
schema = "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json"
name = "io.github.fullbleed-engine/fullbleed-mcp"
title = "Fullbleed PDF Engine"
description = "Create, preview, inspect, verify, and compile deterministic PDF documents with Fullbleed."
website-url = "https://fullbleed.dev"
repository-url = "https://github.com/fullbleed-engine/fullbleed-official"
