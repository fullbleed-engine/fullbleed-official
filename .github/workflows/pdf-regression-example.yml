name: PDF regression starter
on:
  pull_request:
    paths:
      - examples/pdf_regression/**
      - .github/workflows/pdf-regression-example.yml
  push:
    branches: [master, main]
    paths:
      - examples/pdf_regression/**
      - .github/workflows/pdf-regression-example.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-regression-starter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  starter:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: -r examples/pdf_regression/requirements.txt
      - run: python -I examples/pdf_regression/verify.py --out target/pdf-regression-verification
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-regression-starter-${{ runner.os }}
          path: target/pdf-regression-verification/
          if-no-files-found: error
          retention-days: 7
