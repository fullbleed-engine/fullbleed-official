name: CI

env:
  FULLBLEED_CI_VERSION: "2.5.17"
  RUST_MIN_STACK: "4194304"

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions and documentation
        run: python tools/check_release_metadata.py --expected-version "${{ env.FULLBLEED_CI_VERSION }}" --json

  print-profile-preflight:
    uses: ./.github/workflows/pdfvt-release-gate.yml
    with:
      release_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  rust-tests:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FULLBLEED_FONT_DIR: ${{ github.workspace }}/python/fullbleed_assets/fonts
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure image fixture for engine tests
        shell: pwsh
        run: |
          $fixture = "examples/img/full_bleed-logo_small.png"
          New-Item -ItemType Directory -Force "examples/img" | Out-Null
          if (-not (Test-Path $fixture)) {
            $base64 = "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAdSURBVDhPY/jPwPCfEsyALkAqHjVg1IBRAwaLAQAwxP4Q7zYsrwAAAABJRU5ErkJggg=="
            [IO.File]::WriteAllBytes($fixture, [Convert]::FromBase64String($base64))
          }
          Get-Item $fixture | Select-Object FullName, Length

      - name: Verify test font directory
        shell: pwsh
        run: |
          Write-Host "FULLBLEED_FONT_DIR=$env:FULLBLEED_FONT_DIR"
          Get-ChildItem $env:FULLBLEED_FONT_DIR | Select-Object -First 5 Name, Length

      - name: Check bundled Standard 14 metric tables
        run: python tools/generate_base14_metrics.py --check

      - name: Run rust test suite
        run: cargo test --locked -- --nocapture

      - name: Build Rust API documentation with checked links
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::invalid_codeblock_attributes"
        run: cargo doc --locked --no-deps

      - name: Install declared Rust MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Compile packaged crate from a fresh consumer lockfile at MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: python tools/smoke_crates_consumer.py --json

  python-wheel-smoke:
    name: Python Wheel Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify CSS parity status is up to date
        run: python tools/generate_css_parity_status.py --check --json

      - name: Generate CSS parity status artifact
        run: python tools/generate_css_parity_status.py --out output/css_parity_status.ci.json --json

      - name: Upload CSS parity status artifact
        uses: actions/upload-artifact@v7
        with:
          name: css-parity-status-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/css_parity_status.ci.json

      - name: Install smoke-test tools
        run: python -m pip install --upgrade pip pytest

      - name: Build wheel from source
        run: python build_backend/fullbleed_build_backend.py wheel --out target/wheels

      - name: Upload abi3 wheel
        uses: actions/upload-artifact@v7
        with:
          name: abi3-wheel-${{ runner.os }}
          path: target/wheels/fullbleed-*.whl
          if-no-files-found: error

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall target/wheels/fullbleed-*.whl

      - name: Smoke-test installed wheel
        run: python tools/smoke_installed_package.py --expected-version "${{ env.FULLBLEED_CI_VERSION }}" --json

      - name: Verify native Standard 14 preview spacing
        run: python -I tools/smoke_base14_preview.py --out target/base14-preview

      - name: Verify finalized PDF gradient previews
        run: python -I tools/smoke_gradient_preview.py --out target/gradient-preview

      - name: Verify single-copy styled PDF text with an independent reader
        run: |
          python -m pip install pypdf==6.19.0
          python -I tools/smoke_text_extraction.py --out target/text-extraction

      - name: Check tagged grouping decoration across installed rendering paths
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests/test_fullbleed_tagged_decorations.py tests/test_fullbleed_list_figure_semantics.py -q

      - name: Retain styled PDF text and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: text-extraction-${{ runner.os }}
          path: target/text-extraction
          if-no-files-found: warn

      - name: Verify compact font subsets with independent font and PDF readers
        run: |
          python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
          python -I tools/smoke_font_subsets.py --out target/font-subsets

      - name: Verify independent font synthesis in PDFs and previews
        run: python -I tools/smoke_font_synthesis.py --out target/font-synthesis

      - name: Retain font synthesis PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: font-synthesis-${{ runner.os }}
          path: target/font-synthesis
          if-no-files-found: warn

      - name: Verify font family defaults and compiled previews
        run: python -I tools/smoke_font_families.py --out target/font-families

      - name: Verify border-image slices in native previews and independent PDF output
        run: python -I tools/smoke_border_image_slices.py --pdfium --out target/border-image-slices

      - name: Retain border-image PDFs and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: border-image-slices-${{ runner.os }}
          path: target/border-image-slices
          if-no-files-found: warn

      - name: Reproduce bundled preview fonts from pinned inputs
        run: python tools/generate_preview_fonts.py --check

      - name: Verify default Standard 14 glyphs and explicit font precedence
        run: python -I tools/smoke_standard_font_portability.py --out target/standard-font-preview

      - name: Verify identical previews with system fonts hidden
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --mount --propagation private "$(command -v python)" -I \
            tools/smoke_standard_font_portability.py --mask-system-fonts \
            --out target/standard-font-preview-no-system \
            --compare target/standard-font-preview/verification.json

      - name: Retain default font portability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standard-font-portability-${{ runner.os }}
          path: |
            target/standard-font-preview
            target/standard-font-preview-no-system
          if-no-files-found: warn

      - name: Verify mixed inline wrapping with independent PDF readers
        run: python -I tools/smoke_inline_wrapping.py --out target/inline-wrapping

      - name: Verify Arabic text extraction and styled bidirectional fields
        run: python -I tools/smoke_rtl_text.py --out target/rtl-text

      - name: Retain bidirectional PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtl-text-${{ runner.os }}
          path: target/rtl-text
          if-no-files-found: warn

      - name: Retain inline wrapping PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inline-wrapping-${{ runner.os }}
          path: target/inline-wrapping
          if-no-files-found: warn

      - name: Verify inline intrinsic widths with independent PDF readers
        run: python -I tools/smoke_inline_sizing.py --out target/inline-sizing

      - name: Retain inline intrinsic sizing PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inline-sizing-${{ runner.os }}
          path: target/inline-sizing
          if-no-files-found: warn

      - name: Retain font family PDF and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: font-families-${{ runner.os }}
          path: target/font-families
          if-no-files-found: warn

      - name: Retain compact font subset PDFs and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: font-subsets-${{ runner.os }}
          path: target/font-subsets
          if-no-files-found: warn

      - name: Retain gradient PDFs and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradient-preview-${{ runner.os }}
          path: target/gradient-preview
          if-no-files-found: warn

      - name: Retain Standard 14 preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: base14-preview-${{ runner.os }}
          path: target/base14-preview
          if-no-files-found: warn

      - name: Check render watch behavior with the installed engine
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests/test_fullbleed_cli_watch.py -q

      - name: Exercise the installed CLI watcher as a real process
        run: python -I tools/smoke_render_watch.py --out target/watch-smoke

      - name: Check reproducibility baselines and failure controls
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: |
          python -m pytest tests/test_fullbleed_cli_repro.py -q
          python -I tools/smoke_repro_check.py --out target/repro-smoke

      - name: Retain reproducibility checks and changed PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repro-check-${{ runner.os }}
          path: target/repro-smoke
          if-no-files-found: warn

      - name: Retain watch results, PDFs, and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-watch-${{ runner.os }}
          path: target/watch-smoke
          if-no-files-found: warn

      - name: Verify agent artifacts match the installed wheel
        run: python tools/generate_agent_contract.py --python python --check --json

      - name: Verify and build fullbleed-mcp integration package
        run: |
          python tools/generate_mcp_server_json.py --check --json
          python -m pip wheel packages/fullbleed-mcp --no-deps --wheel-dir target/mcp-wheels

      - name: Smoke-test installed MCP stdio package
        shell: bash
        run: |
          python -m pip install --no-deps target/mcp-wheels/fullbleed_mcp-*.whl
          python tools/smoke_mcp_stdio.py --json

      - name: Set up Node for the independent MCP client check
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check installed MCP server with the official client SDK
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/mcp-client-smoke
          node tools/mcp-client-smoke/smoke.mjs

      - name: Run installed-wheel agent workflow examples
        run: python examples/agent_workflows/run_examples.py --out target/agent-examples --json

      - name: Render and verify the designed document showcase
        run: python examples/design_showcase/render.py --out target/design-showcase

      - name: Retain showcase PDFs, previews, and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-showcase-${{ runner.os }}
          path: target/design-showcase
          if-no-files-found: warn

      - name: Install notebook check tools
        run: python -m pip install -r examples/notebooks/requirements-check.txt

      - name: Execute the first-invoice notebook with the installed wheel
        run: python tools/check_quickstart_notebook.py --skip-install --out target/notebook-check

      - name: Retain executed notebook and generated invoice
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-invoice-notebook-${{ runner.os }}
          path: target/notebook-check
          if-no-files-found: warn

      - name: Prepare neutral AgentDocBench smoke task
        run: python tools/agentdocbench.py prepare --workspace target/agentdocbench --task invoice --json

      - name: Install web framework example check tools
        run: python -m pip install -r examples/web_frameworks/requirements-check.txt

      - name: Check PDF responses from FastAPI, Flask, and Django
        run: python examples/web_frameworks/check_examples.py --out target/web-framework-check

      - name: Retain framework response PDFs and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-framework-examples-${{ runner.os }}
          path: target/web-framework-check
          if-no-files-found: warn

      - name: Verify installed-wheel SVG raster fallback
        run: python -m pytest tests/test_fullbleed_svg_raster_fallback.py -q

      - name: Run CSS fixture suite
        run: python tools/run_css_fixture_suite.py --json

      - name: CLI + runtime smoke checks
        run: |
          python -m fullbleed --version
          python -m fullbleed doctor --strict --json
          python -m fullbleed compliance --strict --json
          python tools/check_license_integrity.py --json

  python-version-compatibility:
    name: Python Compatibility (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs:
      - python-wheel-smoke
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Linux abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: abi3-wheel-Linux
          path: dist

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist "fullbleed==${FULLBLEED_CI_VERSION}"
          python tools/smoke_installed_package.py --expected-version "${FULLBLEED_CI_VERSION}" --json
          python -m fullbleed --version
          python -m fullbleed doctor --strict --json

  python-prerelease-compatibility:
    name: Python Preview (${{ matrix.os }}, 3.15.0rc3)
    runs-on: ${{ matrix.os }}
    needs: python-wheel-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.3"
          allow-prereleases: true
          architecture: x64
      - uses: actions/download-artifact@v8
        with:
          name: abi3-wheel-${{ runner.os }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: border-image-slices-${{ runner.os }}
          path: target/python-stable-reference/border-image-slices
      - uses: actions/download-artifact@v8
        with:
          name: base14-preview-${{ runner.os }}
          path: target/python-stable-reference/base14-preview
      - uses: actions/download-artifact@v8
        with:
          name: gradient-preview-${{ runner.os }}
          path: target/python-stable-reference/gradient-preview
      - name: Install the same abi3 wheel built and tested on Python 3.10
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist "fullbleed==${FULLBLEED_CI_VERSION}"
          python -m pip install --only-binary=:all: pytest==9.1.1 jsonschema==4.26.0 pypdf==6.19.0 pypdfium2==5.14.0 pillow==12.3.0 fonttools==4.65.0
      - name: Exercise the installed API and CLI in isolation
        shell: bash
        run: |
          mkdir -p target/python-prerelease
          python -I tools/smoke_installed_package.py --expected-version "${FULLBLEED_CI_VERSION}" --json > target/python-prerelease/installed-package.json
          python -I -m fullbleed doctor --strict --json > target/python-prerelease/doctor.json
          python -I -m fullbleed agent-contract --format json > target/python-prerelease/agent-contract.json
      - name: Run repository Python tests with the installed native extension
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests -q -ra --junitxml target/python-prerelease/python-tests.xml
      - name: Generate and check PDFs and previews
        shell: bash
        run: |
          python -I tools/smoke_border_image_slices.py --pdfium --out target/python-prerelease/border-image-slices
          python -I tools/smoke_base14_preview.py --out target/python-prerelease/base14-preview
          python -I tools/smoke_gradient_preview.py --out target/python-prerelease/gradient-preview
      - name: Verify exact interpreter and identical output across Python versions
        shell: bash
        run: |
          python -I tools/check_python_compatibility.py \
            --expected-python 3.15.0rc3 --expected-version "${FULLBLEED_CI_VERSION}" \
            --reference target/python-stable-reference --out target/python-prerelease \
            --allow-skipped-test tests.test_fullbleed_python_abi.test_stable_abi_module_can_initialize_in_a_subinterpreter
      - name: Retain interpreter, test, PDF, and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-prerelease-${{ runner.os }}-3.15.0rc3
          path: target/python-prerelease
          if-no-files-found: error

  standard-font-portability:
    name: Standard font previews match across Windows and Linux
    runs-on: ubuntu-latest
    needs: python-wheel-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: standard-font-portability-*
          path: target/standard-font-portability
      - name: Compare all retained pixels and PDFs
        run: python tools/compare_standard_font_previews.py target/standard-font-portability --out target/standard-font-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: standard-font-cross-platform-comparison
          path: target/standard-font-comparison.json
          if-no-files-found: warn

  goldens:
    name: Goldens (Windows, py3.11)
    runs-on: windows-latest
    needs:
      - rust-tests
      - python-wheel-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel from source
        run: python build_backend/fullbleed_build_backend.py wheel --out target/wheels

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall target/wheels/fullbleed-*.whl

      - name: Verify golden suite
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python goldens/run_golden_suite.py --python python verify

      - name: Verify minimal per-page template flagging smoke
        run: python examples/template-flagging-smoke/run_smoke.py

      - name: Verify CLI compose-image template smoke
        run: python examples/template-flagging-smoke/run_cli_compose_image_smoke.py

      - name: Verify CLI cross-process determinism smoke
        run: python examples/template-flagging-smoke/run_cli_determinism_smoke.py

      - name: Verify templated back-page VDP smoke
        run: python examples/template-flagging-smoke/run_vdp_backpage_smoke.py
