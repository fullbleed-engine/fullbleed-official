name: Release

env:
  RUST_MIN_STACK: "4194304"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the validated Python distributions to PyPI"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Optional existing annotated tag to rebuild; also supply its release_commit"
        required: false
        type: string
        default: ""
      release_commit:
        description: "Exact 40-character commit of release_tag; leaves the tag and package source unchanged"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_commit || github.sha }}
  cancel-in-progress: false

jobs:
  pdfvt-preflight:
    uses: ./.github/workflows/pdfvt-release-gate.yml
    with:
      release_ref: ${{ inputs.release_commit || github.sha }}

  validate:
    needs: pdfvt-preflight
    name: Validate release metadata and source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      source_sha: ${{ steps.release-version.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve and validate release version
        id: release-version
        shell: python
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_SOURCE_RECORD: target/release-source.json
        run: |
          import json, os, pathlib, re, subprocess, sys, tomllib

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          requested_tag = os.environ["REQUESTED_TAG"]
          requested_commit = os.environ["REQUESTED_COMMIT"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          source_sha = git("rev-parse", "HEAD")
          if bool(requested_tag) != bool(requested_commit):
              raise SystemExit("Provide release_tag and release_commit together")
          if requested_commit:
              if not re.fullmatch(r"[0-9a-f]{40}", requested_commit) or source_sha != requested_commit:
                  raise SystemExit("Checkout does not match the exact requested release_commit")
              tag = requested_tag
          else:
              if source_sha != os.environ["WORKFLOW_COMMIT"]:
                  raise SystemExit("Checkout does not match the triggering workflow commit")
              tag = workflow_ref.removeprefix("refs/tags/") if workflow_ref.startswith("refs/tags/") else ""
          tag_object = None
          if tag:
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?", tag):
                  raise SystemExit("Use an exact vMAJOR.MINOR.PATCH release tag, optionally with a Python prerelease suffix")
              ref = "refs/tags/" + tag
              if git("cat-file", "-t", ref) != "tag" or git("rev-parse", ref + "^{}") != source_sha:
                  raise SystemExit("The annotated release tag does not match the checked-out commit")
              tag_object = git("rev-parse", ref)
              version = tag[1:]
          else:
              version = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          subprocess.run([sys.executable, "tools/check_release_metadata.py", "--expected-version", version, "--json"], check=True)
          record = dict(version=version, release_tag=tag or None, tag_object=tag_object,
              source_commit=source_sha, source_tree=git("rev-parse", "HEAD^{tree}"),
              workflow_commit=os.environ["WORKFLOW_COMMIT"], workflow_ref=workflow_ref)
          record_path = pathlib.Path(os.environ["RELEASE_SOURCE_RECORD"])
          record_path.parent.mkdir(parents=True, exist_ok=True)
          record_path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nsource_sha={source_sha}\n")

      - name: Retain immutable source and workflow provenance
        uses: actions/upload-artifact@v7
        with:
          name: release-source-provenance
          path: target/release-source.json
          if-no-files-found: error

      - name: Validate MIT license metadata
        run: python tools/check_license_integrity.py --json

      - name: Check bundled Standard 14 metric tables
        run: python tools/generate_base14_metrics.py --check

      - name: Validate clean release worktree
        run: python tools/check_release_worktree.py --json

      - name: Install Python test tools
        run: python -m pip install pytest jsonschema pypdf==6.19.0 pypdfium2==5.14.0 pillow==12.3.0

      - name: Build and install extension from release source
        shell: bash
        run: |
          python build_backend/fullbleed_build_backend.py wheel --out target/validate-wheel
          python -m pip install --force-reinstall target/validate-wheel/*.whl

      - name: Verify agent artifacts match the release wheel
        run: python tools/generate_agent_contract.py --python python --check --json

      - name: Validate first-party MCP package metadata
        run: python tools/generate_mcp_server_json.py --check --json

      - name: Set up Node for MCP interoperability validation
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate release wheel with the official MCP client
        run: |
          python -m pip install --no-deps ./packages/fullbleed-mcp
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/mcp-client-smoke
          node tools/mcp-client-smoke/smoke.mjs

      - name: Test Python package and CLI
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest -q

      - name: Exercise installed reproducibility failure controls
        run: python -I tools/smoke_repro_check.py --out target/repro-smoke

      - name: Verify native Standard 14 preview spacing
        run: python -I tools/smoke_base14_preview.py --out target/base14-preview

      - name: Verify bundled preview fonts and defaults without system fonts
        shell: bash
        run: |
          python -m pip install fonttools==4.65.0 pillow==12.3.0
          python tools/generate_preview_fonts.py --check
          python -I tools/smoke_standard_font_portability.py --out target/standard-font-preview
          sudo unshare --mount --propagation private "$(command -v python)" -I \
            tools/smoke_standard_font_portability.py --mask-system-fonts \
            --out target/standard-font-preview-no-system \
            --compare target/standard-font-preview/verification.json

      - name: Retain default font portability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-standard-font-portability
          path: |
            target/standard-font-preview
            target/standard-font-preview-no-system
          if-no-files-found: warn

      - name: Verify finalized PDF gradient previews
        run: python -I tools/smoke_gradient_preview.py --out target/gradient-preview

      - name: Verify radial gradient endpoint colors
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests/test_fullbleed_radial_gradient_endpoint.py -q -ra --basetemp target/radial-gradient-endpoints --junitxml target/radial-gradient-endpoints/tests.xml

      - name: Retain radial endpoint PDFs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-radial-gradient-endpoints
          path: target/radial-gradient-endpoints
          if-no-files-found: error

      - name: Verify PDF gradient stitching boundaries
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests/test_fullbleed_gradient_function_bounds.py -q --junitxml target/gradient-function-bounds.xml

      - name: Retain gradient function regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gradient-function-bounds
          path: target/gradient-function-bounds.xml
          if-no-files-found: error

      - name: Verify border-image slices in previews and independent PDF rendering
        run: |
          python -m pip install pypdfium2==5.14.0
          python -I tools/smoke_border_image_slices.py --pdfium --out target/border-image-slices

      - name: Retain border-image PDFs and all three preview modes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-border-image-slices
          path: target/border-image-slices
          if-no-files-found: warn

      - name: Verify independent font synthesis in installed release output
        run: python -I tools/smoke_font_synthesis.py --out target/font-synthesis

      - name: Verify font-selected decoration thickness in installed release output
        run: python -I tools/smoke_text_decoration_thickness.py --out target/text-decoration-thickness

      - name: Retain text decoration release PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-text-decoration-thickness
          path: target/text-decoration-thickness
          if-no-files-found: warn

      - name: Verify continuous decorations across word spaces and inline boundaries
        run: python -I tools/smoke_text_decoration_spaces.py --out target/text-decoration-spaces

      - name: Retain continuous-decoration PDFs and independent previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-text-decoration-spaces
          path: target/text-decoration-spaces
          if-no-files-found: error

      - name: Verify authored preformatted wrapping in saved PDFs
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests/test_fullbleed_preformatted_whitespace.py -q --basetemp target/preformatted-whitespace --junitxml target/preformatted-whitespace.xml

      - name: Retain preformatted PDFs, glyph bounds and independent previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preformatted-whitespace
          path: |
            target/preformatted-whitespace/
            target/preformatted-whitespace.xml
          if-no-files-found: error

      - name: Verify hidden HTML text and author display overrides
        run: python -I tools/smoke_hidden_text.py --out target/hidden-text

      - name: Retain hidden-text release PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-hidden-text
          path: target/hidden-text
          if-no-files-found: error

      - name: Verify embedded stylesheets across installed rendering paths
        run: python -I tools/smoke_embedded_styles.py --out target/embedded-styles

      - name: Verify SVG cascade and group opacity in PDFs, layout and finalized previews
        run: python -I tools/smoke_svg_styles.py --out target/svg-styles

      - name: Verify inset shadow geometry and unshadowed edges in release output
        run: python -I tools/smoke_inset_shadows.py --pdfium --out target/inset-shadows

      - name: Retain inset shadow PDFs and independent previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-inset-shadows
          path: target/inset-shadows/
          if-no-files-found: error

      - name: Retain SVG cascade release PDFs and independent previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-svg-styles
          path: target/svg-styles/
          if-no-files-found: error

      - name: Retain embedded stylesheet PDFs and independent previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-embedded-styles
          path: target/embedded-styles
          if-no-files-found: error

      - name: Verify floated initials in installed release output
        run: python -I tools/smoke_floating_first_letter.py --out target/floating-first-letter

      - name: Retain floated-initial release PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-floating-first-letter
          path: target/floating-first-letter
          if-no-files-found: warn

      - name: Verify filtered descendants preserve ancestor clipping and stacking
        run: python -I tools/smoke_filtered_overflow.py --pdfium --out target/filtered-overflow

      - name: Retain filtered overflow PDFs and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-filtered-overflow
          path: target/filtered-overflow
          if-no-files-found: warn

      - name: Verify counter scopes in emitted release PDFs
        run: python -I tools/smoke_counter_scopes.py --out target/counter-scopes

      - name: Retain counter scope PDFs and extracted labels
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-counter-scopes
          path: target/counter-scopes
          if-no-files-found: warn

      - name: Retain font synthesis PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-font-synthesis
          path: target/font-synthesis
          if-no-files-found: warn

      - name: Verify single-copy styled PDF text with an independent reader
        run: |
          python -m pip install pypdf==6.19.0
          python -I tools/smoke_text_extraction.py --out target/text-extraction

      - name: Retain styled PDF text and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-text-extraction
          path: target/text-extraction
          if-no-files-found: warn

      - name: Retain gradient PDFs and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gradient-preview
          path: target/gradient-preview
          if-no-files-found: warn

      - name: Retain Standard 14 preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-base14-preview
          path: target/base14-preview
          if-no-files-found: warn

      - name: Retain release reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-repro-check
          path: target/repro-smoke
          if-no-files-found: warn

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust source
        run: cargo test --locked

      - name: Test Rust extension feature set
        run: cargo test --locked --features python,svg_raster

      - name: Package audit contract crate
        run: cargo package --locked --manifest-path crates/fullbleed_audit_contract/Cargo.toml

      - name: Validate main crate package file set
        shell: bash
        run: cargo package --locked --list > target/fullbleed-package-files.txt

      - name: Install declared Rust MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Compile packaged crate from a fresh consumer lockfile at MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: |
          python tools/smoke_crates_consumer.py \
            --expected-version "${{ steps.release-version.outputs.version }}" \
            --json

      - name: Upload Cargo package evidence
        uses: actions/upload-artifact@v7
        with:
          name: cargo-packages
          path: |
            target/fullbleed-package-files.txt
            crates/fullbleed_audit_contract/target/package/*.crate
          if-no-files-found: error

      - name: Verify compact font subsets with independent font and PDF readers
        run: |
          python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
          python -I tools/smoke_font_subsets.py --out target/font-subsets

      - name: Verify font family defaults and compiled previews
        run: python -I tools/smoke_font_families.py --out target/font-families

      - name: Verify saved table tags, content ownership and header relationships
        run: python -I tools/smoke_table_tagging.py --out target/table-tagging

      - name: Verify caption ownership and reading order across pages and records
        run: python -I tools/smoke_table_captions.py --out target/table-captions

      - name: Verify page furniture stays outside body reading order
        run: python -I tools/smoke_page_furniture.py --out target/page-furniture

      - name: Verify running header and footer values across records
        run: python -I tools/smoke_running_reflow.py --out target/running-reflow

      - name: Retain page furniture PDFs and structure checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-page-furniture
          path: target/page-furniture/
          if-no-files-found: error

      - name: Retain running record PDFs and independent comparisons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-running-reflow
          path: target/running-reflow/
          if-no-files-found: error

      - name: Verify oversized table cells stay visible and retain logical structure
        run: python -I tools/smoke_oversized_table.py --out target/oversized-table

      - name: Verify reflow recipients, table layout and fonts across batches
        env:
          FULLBLEED_TEST_INSTALLED_NATIVE: "1"
        run: python -m pytest tests/test_fullbleed_oversized_table.py -k reflow -q --basetemp target/reflow-cache-tests --junitxml target/reflow-cache-tests.xml

      - name: Retain table PDFs, structure checks and independent previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-table-tagging
          path: |
            target/table-tagging/
            target/table-captions/
            target/oversized-table/
            target/reflow-cache-tests/
            target/reflow-cache-tests.xml
          if-no-files-found: error

      - name: Verify mixed inline wrapping with independent PDF readers
        run: python -I tools/smoke_inline_wrapping.py --out target/inline-wrapping

      - name: Verify inline line heights and page breaks with an independent PDF reader
        run: python -I tools/smoke_inline_line_height.py --out target/inline-line-height

      - name: Retain inline line-height PDFs and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-inline-line-height
          path: target/inline-line-height
          if-no-files-found: warn

      - name: Verify Arabic text extraction and styled bidirectional fields
        run: python -I tools/smoke_rtl_text.py --out target/rtl-text

      - name: Retain bidirectional PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-rtl-text
          path: target/rtl-text
          if-no-files-found: warn

      - name: Verify inline intrinsic widths with independent PDF readers
        run: python -I tools/smoke_inline_sizing.py --out target/inline-sizing

      - name: Retain inline intrinsic sizing PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-inline-sizing
          path: target/inline-sizing
          if-no-files-found: error

      - name: Retain inline wrapping PDFs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-inline-wrapping
          path: target/inline-wrapping
          if-no-files-found: error

      - name: Retain font family PDF and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-font-families
          path: target/font-families
          if-no-files-found: warn

      - name: Retain compact font subset PDFs and preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-font-subsets
          path: target/font-subsets
          if-no-files-found: error

  build-wheels:
    name: Build wheel (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: manylinux-x86_64
            compatibility: manylinux2014
            container: "quay.io/pypa/manylinux2014_x86_64:latest"
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            label: manylinux-x86
            compatibility: manylinux2014
            container: "quay.io/pypa/manylinux2014_i686:latest"
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            label: manylinux-aarch64
            compatibility: manylinux2014
            container: "ghcr.io/rust-cross/manylinux2014-cross:aarch64"
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            label: manylinux-armv7
            compatibility: manylinux2014
            container: "ghcr.io/rust-cross/manylinux2014-cross:armv7"
          - os: ubuntu-22.04
            target: s390x-unknown-linux-gnu
            label: manylinux-s390x
            compatibility: manylinux2014
            container: "ghcr.io/rust-cross/manylinux2014-cross:s390x"
          - os: ubuntu-22.04
            target: powerpc64le-unknown-linux-gnu
            label: manylinux-ppc64le
            compatibility: manylinux2014
            container: "ghcr.io/rust-cross/manylinux2014-cross:ppc64le"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            label: musllinux-x86_64
            compatibility: musllinux_1_2
            container: "ghcr.io/rust-cross/rust-musl-cross:x86_64-musl"
          - os: ubuntu-22.04
            target: i686-unknown-linux-musl
            label: musllinux-x86
            compatibility: musllinux_1_2
            container: "ghcr.io/rust-cross/rust-musl-cross:i686-musl"
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            label: musllinux-aarch64
            compatibility: musllinux_1_2
            container: "ghcr.io/rust-cross/rust-musl-cross:aarch64-musl"
          - os: ubuntu-22.04
            target: armv7-unknown-linux-musleabihf
            label: musllinux-armv7
            compatibility: musllinux_1_2
            container: "ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            compatibility: "off"
            container: ""
            build_python: "3.10"
            python_arch: x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            label: windows-x86
            compatibility: "off"
            container: ""
            build_python: "3.10"
            python_arch: x86
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            compatibility: "off"
            container: ""
            build_python: "3.13"
            python_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            compatibility: "off"
            container: ""
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
            compatibility: "off"
            container: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Setup build Python
        if: matrix.container == '' && runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup target-architecture Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.build_python }}
          architecture: ${{ matrix.python_arch }}

      - name: Install Rust stable for native build
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native abi3 wheel
        if: matrix.container == ''
        run: python build_backend/fullbleed_build_backend.py wheel --out dist --target ${{ matrix.target }} --compatibility off

      - name: Build Linux policy abi3 wheel
        if: matrix.container != ''
        shell: bash
        run: |
          docker run --rm \
            -v "${PWD}:/io" \
            -w /io \
            "${{ matrix.container }}" \
            sh tools/build_linux_wheel_container.sh \
              "${{ matrix.target }}" \
              "${{ matrix.compatibility }}" \
              dist

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: python build_backend/fullbleed_build_backend.py sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-native-wheels:
    name: Smoke native wheel (${{ matrix.label }}, Python ${{ matrix.python }})
    needs:
      - validate
      - build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            label: windows-x86_64
            python: "3.10"
            python_arch: x64
          - os: windows-latest
            artifact: windows-x86
            label: windows-x86
            python: "3.10"
            python_arch: x86
          - os: windows-11-arm
            artifact: windows-arm64
            label: windows-arm64
            python: "3.13"
            python_arch: arm64
          - os: macos-15-intel
            artifact: macos-x86_64
            label: macos-x86_64
            python: "3.10"
            python_arch: x64
          - os: macos-15
            artifact: macos-aarch64
            label: macos-aarch64
            python: "3.10"
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist "fullbleed==${{ needs.validate.outputs.version }}"

      - name: Verify installed package
        run: |
          python tools/smoke_installed_package.py --expected-version "${{ needs.validate.outputs.version }}" --json
          python -m fullbleed --version
          python -m fullbleed doctor --strict --json
          python -m fullbleed compliance --strict --json

      - name: Verify installed CLI watch mode on the native platform
        run: python -I tools/smoke_render_watch.py --out target/watch-smoke

      - name: Retain native watch results and document stages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-watch-${{ matrix.label }}
          path: target/watch-smoke
          if-no-files-found: warn

  test-linux-wheels:
    name: Smoke Linux wheel (${{ matrix.label }}, Python ${{ matrix.python }})
    needs:
      - validate
      - build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.10"
            image: python:3.10-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.11"
            image: python:3.11-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.12"
            image: python:3.12-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.13"
            image: python:3.13-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.14"
            image: python:3.14-slim
            platform: linux/amd64
          - artifact: manylinux-x86
            label: manylinux-x86
            python: "3.10"
            image: python:3.10-slim
            platform: linux/386
          - artifact: manylinux-aarch64
            label: manylinux-aarch64
            python: "3.10"
            image: python:3.10-slim
            platform: linux/arm64
          - artifact: manylinux-armv7
            label: manylinux-armv7
            python: "3.10"
            image: python:3.10-slim
            platform: linux/arm/v7
          - artifact: manylinux-s390x
            label: manylinux-s390x
            python: "3.10"
            image: python:3.10-slim
            platform: linux/s390x
          - artifact: manylinux-ppc64le
            label: manylinux-ppc64le
            python: "3.10"
            image: python:3.10-slim
            platform: linux/ppc64le
          - artifact: musllinux-x86_64
            label: musllinux-x86_64
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/amd64
          - artifact: musllinux-x86
            label: musllinux-x86
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/386
          - artifact: musllinux-aarch64
            label: musllinux-aarch64
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/arm64
          - artifact: musllinux-armv7
            label: musllinux-armv7
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/arm/v7
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist

      - name: Setup QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: all

      - name: Install and verify wheel in target container
        shell: bash
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --network none \
            -e FULLBLEED_VERSION="${{ needs.validate.outputs.version }}" \
            -v "${PWD}:/io:ro" \
            -w /tmp \
            "${{ matrix.image }}" \
            sh -euxc '
              python -m pip install --disable-pip-version-check \
                --no-index --find-links /io/dist \
                "fullbleed==${FULLBLEED_VERSION}"
              python /io/tools/smoke_installed_package.py \
                --expected-version "${FULLBLEED_VERSION}" --json
              python -m fullbleed --version
              python -m fullbleed doctor --strict --json
              python -m fullbleed compliance --strict --json
            '

  assemble:
    name: Validate distribution set
    needs:
      - validate
      - build-wheels
      - build-sdist
      - test-native-wheels
      - test-linux-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout description verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate package metadata and abi3 wheel tags
        shell: bash
        run: |
          python -m pip install "twine==7.0.0" "readme-renderer[md]==45.0" "comrak==0.0.12"
          python -m unittest tools.package_description_tests -v
          python -m twine check dist/*
          python tools/check_package_description.py dist --expected-version "${{ needs.validate.outputs.version }}" --out target/package-description
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 15, (
              f"expected 15 platform wheels, observed {len(wheels)}: "
              f"{[wheel.name for wheel in wheels]}"
          )
          invalid = [wheel.name for wheel in wheels if "-cp310-abi3-" not in wheel.name]
          assert not invalid, f"non-abi3 wheel tags: {invalid}"
          required_platforms = {
              "manylinux x86-64": ("manylinux_2_17_x86_64",),
              "manylinux x86": ("manylinux_2_17_i686",),
              "manylinux ARM64": ("manylinux_2_17_aarch64",),
              "manylinux ARMv7": ("manylinux_2_17_armv7l",),
              "manylinux s390x": ("manylinux_2_17_s390x",),
              "manylinux ppc64le": ("manylinux_2_17_ppc64le",),
              "musllinux x86-64": ("musllinux_1_2_x86_64",),
              "musllinux x86": ("musllinux_1_2_i686",),
              "musllinux ARM64": ("musllinux_1_2_aarch64",),
              "musllinux ARMv7": ("musllinux_1_2_armv7l",),
              "Windows x86-64": ("-win_amd64.whl",),
              "Windows x86": ("-win32.whl",),
              "Windows ARM64": ("-win_arm64.whl",),
              "macOS x86-64": ("-macosx_", "_x86_64.whl"),
              "macOS ARM64": ("-macosx_", "_arm64.whl"),
          }
          missing = [
              label
              for label, fragments in required_platforms.items()
              if not any(
                  all(fragment in wheel.name for fragment in fragments)
                  for wheel in wheels
              )
          ]
          assert not missing, f"missing wheel platforms: {missing}"
          print("\n".join(wheel.name for wheel in wheels))
          PY

      - name: Retain checked package descriptions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-package-descriptions
          path: target/package-description
          if-no-files-found: error

      - name: Upload complete distribution set
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI distributions
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    needs:
      - assemble
    runs-on: ubuntu-latest
    environment: "pypi"
    permissions:
      id-token: write
    steps:
      - name: Download complete distribution set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
