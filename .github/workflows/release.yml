name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish validated artifacts to crates.io and PyPI via trusted publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata and source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve and validate release version
        id: release-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'import re; print(re.search(r"(?ms)^\\[package\\].*?^version = \"([^\"]+)\"", open("Cargo.toml", encoding="utf-8").read()).group(1))')"
          fi
          python tools/check_release_metadata.py --expected-version "${version}" --json
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate MIT license metadata
        run: python tools/check_license_integrity.py --json

      - name: Validate clean release worktree
        run: python tools/check_release_worktree.py --json

      - name: Install Python test tools
        run: python -m pip install "maturin==1.14.1" pytest

      - name: Build and install extension from release source
        shell: bash
        run: |
          python -m maturin build --release --locked --out target/validate-wheel
          python -m pip install --force-reinstall target/validate-wheel/*.whl

      - name: Test Python package and CLI
        run: python -m pytest -q

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust source
        run: cargo test --locked

      - name: Test Rust extension feature set
        run: cargo test --locked --features python,svg_raster

      - name: Package audit contract crate
        run: cargo package --locked --manifest-path crates/fullbleed_audit_contract/Cargo.toml

      - name: Validate main crate package file set
        shell: bash
        run: cargo package --locked --list > target/fullbleed-package-files.txt

      - name: Upload Cargo package evidence
        uses: actions/upload-artifact@v7
        with:
          name: cargo-packages
          path: |
            target/fullbleed-package-files.txt
            crates/fullbleed_audit_contract/target/package/*.crate
          if-no-files-found: error

  build-wheels:
    name: Build wheel (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
            label: manylinux-x86_64
            manylinux: "2014"
          - os: ubuntu-22.04
            target: x86
            label: manylinux-x86
            manylinux: "2014"
          - os: ubuntu-22.04
            target: aarch64
            label: manylinux-aarch64
            manylinux: "2014"
          - os: ubuntu-22.04
            target: armv7
            label: manylinux-armv7
            manylinux: "2014"
          - os: ubuntu-22.04
            target: s390x
            label: manylinux-s390x
            manylinux: "2014"
          - os: ubuntu-22.04
            target: ppc64le
            label: manylinux-ppc64le
            manylinux: "2014"
          - os: ubuntu-22.04
            target: x86_64
            label: musllinux-x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-22.04
            target: x86
            label: musllinux-x86
            manylinux: musllinux_1_2
          - os: ubuntu-22.04
            target: aarch64
            label: musllinux-aarch64
            manylinux: musllinux_1_2
          - os: ubuntu-22.04
            target: armv7
            label: musllinux-armv7
            manylinux: musllinux_1_2
          - os: windows-latest
            target: x64
            label: windows-x86_64
            manylinux: "off"
            build_python: "3.10"
            python_arch: x64
          - os: windows-latest
            target: x86
            label: windows-x86
            manylinux: "off"
            build_python: "3.10"
            python_arch: x86
          - os: windows-11-arm
            target: aarch64
            label: windows-arm64
            manylinux: "off"
            build_python: "3.13"
            python_arch: arm64
          - os: macos-15-intel
            target: x86_64
            label: macos-x86_64
            manylinux: "off"
          - os: macos-15
            target: aarch64
            label: macos-aarch64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup target-architecture Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.build_python }}
          architecture: ${{ matrix.python_arch }}

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.14.1
          args: --release --locked --out dist
          sccache: "true"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install "maturin==1.14.1"

      - name: Build source distribution
        run: python -m maturin sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-native-wheels:
    name: Smoke native wheel (${{ matrix.label }}, Python ${{ matrix.python }})
    needs:
      - validate
      - build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            label: windows-x86_64
            python: "3.10"
            python_arch: x64
          - os: windows-latest
            artifact: windows-x86
            label: windows-x86
            python: "3.10"
            python_arch: x86
          - os: windows-11-arm
            artifact: windows-arm64
            label: windows-arm64
            python: "3.13"
            python_arch: arm64
          - os: macos-15-intel
            artifact: macos-x86_64
            label: macos-x86_64
            python: "3.10"
            python_arch: x64
          - os: macos-15
            artifact: macos-aarch64
            label: macos-aarch64
            python: "3.10"
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist "fullbleed==${{ needs.validate.outputs.version }}"

      - name: Verify installed package
        run: |
          python tools/smoke_installed_package.py --expected-version "${{ needs.validate.outputs.version }}" --json
          python -m fullbleed --version
          python -m fullbleed doctor --strict --json
          python -m fullbleed compliance --strict --json

  test-linux-wheels:
    name: Smoke Linux wheel (${{ matrix.label }}, Python ${{ matrix.python }})
    needs:
      - validate
      - build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.10"
            image: python:3.10-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.11"
            image: python:3.11-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.12"
            image: python:3.12-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.13"
            image: python:3.13-slim
            platform: linux/amd64
          - artifact: manylinux-x86_64
            label: manylinux-x86_64
            python: "3.14"
            image: python:3.14-slim
            platform: linux/amd64
          - artifact: manylinux-x86
            label: manylinux-x86
            python: "3.10"
            image: python:3.10-slim
            platform: linux/386
          - artifact: manylinux-aarch64
            label: manylinux-aarch64
            python: "3.10"
            image: python:3.10-slim
            platform: linux/arm64
          - artifact: manylinux-armv7
            label: manylinux-armv7
            python: "3.10"
            image: python:3.10-slim
            platform: linux/arm/v7
          - artifact: manylinux-s390x
            label: manylinux-s390x
            python: "3.10"
            image: python:3.10-slim
            platform: linux/s390x
          - artifact: manylinux-ppc64le
            label: manylinux-ppc64le
            python: "3.10"
            image: python:3.10-slim
            platform: linux/ppc64le
          - artifact: musllinux-x86_64
            label: musllinux-x86_64
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/amd64
          - artifact: musllinux-x86
            label: musllinux-x86
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/386
          - artifact: musllinux-aarch64
            label: musllinux-aarch64
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/arm64
          - artifact: musllinux-armv7
            label: musllinux-armv7
            python: "3.10"
            image: python:3.10-alpine
            platform: linux/arm/v7
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist

      - name: Setup QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: all

      - name: Install and verify wheel in target container
        shell: bash
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --network none \
            -e FULLBLEED_VERSION="${{ needs.validate.outputs.version }}" \
            -v "${PWD}:/io:ro" \
            -w /tmp \
            "${{ matrix.image }}" \
            sh -euxc '
              python -m pip install --disable-pip-version-check \
                --no-index --find-links /io/dist \
                "fullbleed==${FULLBLEED_VERSION}"
              python /io/tools/smoke_installed_package.py \
                --expected-version "${FULLBLEED_VERSION}" --json
              python -m fullbleed --version
              python -m fullbleed doctor --strict --json
              python -m fullbleed compliance --strict --json
            '

  assemble:
    name: Validate distribution set
    needs:
      - validate
      - build-wheels
      - build-sdist
      - test-native-wheels
      - test-linux-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate package metadata and abi3 wheel tags
        shell: bash
        run: |
          python -m pip install "twine==7.0.0"
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 15, (
              f"expected 15 platform wheels, observed {len(wheels)}: "
              f"{[wheel.name for wheel in wheels]}"
          )
          invalid = [wheel.name for wheel in wheels if "-cp310-abi3-" not in wheel.name]
          assert not invalid, f"non-abi3 wheel tags: {invalid}"
          required_platforms = {
              "manylinux x86-64": ("manylinux_2_17_x86_64",),
              "manylinux x86": ("manylinux_2_17_i686",),
              "manylinux ARM64": ("manylinux_2_17_aarch64",),
              "manylinux ARMv7": ("manylinux_2_17_armv7l",),
              "manylinux s390x": ("manylinux_2_17_s390x",),
              "manylinux ppc64le": ("manylinux_2_17_ppc64le",),
              "musllinux x86-64": ("musllinux_1_2_x86_64",),
              "musllinux x86": ("musllinux_1_2_i686",),
              "musllinux ARM64": ("musllinux_1_2_aarch64",),
              "musllinux ARMv7": ("musllinux_1_2_armv7l",),
              "Windows x86-64": ("-win_amd64.whl",),
              "Windows x86": ("-win32.whl",),
              "Windows ARM64": ("-win_arm64.whl",),
              "macOS x86-64": ("-macosx_", "_x86_64.whl"),
              "macOS ARM64": ("-macosx_", "_arm64.whl"),
          }
          missing = [
              label
              for label, fragments in required_platforms.items()
              if not any(
                  all(fragment in wheel.name for fragment in fragments)
                  for wheel in wheels
              )
          ]
          assert not missing, f"missing wheel platforms: {missing}"
          print("\n".join(wheel.name for wheel in wheels))
          PY

      - name: Upload complete distribution set
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error

  publish-cargo:
    name: Publish crates.io packages
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
      - validate
      - assemble
    runs-on: ubuntu-latest
    environment: "crates-io"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish audit contract, then main crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          audit_version="$(python -c 'import re; print(re.search(r"(?ms)^\\[package\\].*?^version = \"([^\"]+)\"", open("crates/fullbleed_audit_contract/Cargo.toml", encoding="utf-8").read()).group(1))')"
          main_version="${{ needs.validate.outputs.version }}"

          crate_has_version() {
            curl --fail --silent --show-error "https://crates.io/api/v1/crates/$1" |
              python -c "import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if any(v['num'] == '$2' for v in data['versions']) else 1)"
          }

          if ! crate_has_version fullbleed_audit_contract "${audit_version}"; then
            cargo publish --locked --manifest-path crates/fullbleed_audit_contract/Cargo.toml
          fi

          for attempt in {1..18}; do
            if crate_has_version fullbleed_audit_contract "${audit_version}"; then
              break
            fi
            if [[ "${attempt}" == "18" ]]; then
              echo "fullbleed_audit_contract ${audit_version} did not propagate to crates.io" >&2
              exit 1
            fi
            sleep 10
          done

          for attempt in {1..18}; do
            if crate_has_version fullbleed "${main_version}"; then
              break
            fi
            if cargo publish --locked; then
              break
            fi
            if [[ "${attempt}" == "18" ]]; then
              echo "Unable to publish fullbleed ${main_version} after dependency propagation" >&2
              exit 1
            fi
            sleep 10
          done

  publish-pypi:
    name: Publish PyPI distributions
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
      - assemble
      - publish-cargo
    runs-on: ubuntu-latest
    environment: "pypi"
    permissions:
      id-token: write
    steps:
      - name: Download complete distribution set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
