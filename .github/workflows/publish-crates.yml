name: Publish crates.io

env:
  RUST_MIN_STACK: "4194304"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated release tag whose exact source commit will be published"
        required: true
        type: string
        default: "v2.2.5"
      publish:
        description: "Publish after all validation gates pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact crate release source
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      main_version: ${{ steps.release.outputs.main_version }}
      audit_version: ${{ steps.release.outputs.audit_version }}
    steps:
      - name: Checkout requested release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-28
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve immutable release source
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "${RELEASE_TAG} must be an annotated tag" >&2
            exit 1
          fi

          release_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${release_sha}" != "${checked_out_sha}" ]]; then
            echo "Checked-out commit does not match ${RELEASE_TAG}" >&2
            exit 1
          fi

          main_version="${RELEASE_TAG#v}"
          audit_version="$(python -c 'import tomllib; print(tomllib.load(open("crates/fullbleed_audit_contract/Cargo.toml", "rb"))["package"]["version"])')"
          python tools/check_release_metadata.py --expected-version "${main_version}" --json

          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "main_version=${main_version}" >> "${GITHUB_OUTPUT}"
          echo "audit_version=${audit_version}" >> "${GITHUB_OUTPUT}"

      - name: Enforce MIT crate licensing
        run: |
          python tools/check_license_integrity.py --json
          python - <<'PY'
          from pathlib import Path
          import tomllib

          manifests = (
              Path("Cargo.toml"),
              Path("crates/fullbleed_audit_contract/Cargo.toml"),
          )
          for manifest in manifests:
              package = tomllib.loads(manifest.read_text(encoding="utf-8"))["package"]
              assert package["license"] == "MIT", (
                  f"{manifest}: expected MIT, found {package.get('license')!r}"
              )

          root_license = Path("LICENSE").read_text(encoding="utf-8")
          audit_license = Path(
              "crates/fullbleed_audit_contract/LICENSE"
          ).read_text(encoding="utf-8")
          assert root_license.startswith("MIT License")
          assert audit_license == root_license

          forbidden = ("GNU Affero General Public License", "GNU General Public License")
          for manifest in manifests:
              text = manifest.read_text(encoding="utf-8")
              assert not any(marker in text for marker in forbidden), manifest
          PY

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust source
        run: cargo test --locked

      - name: Test Rust extension feature set
        run: cargo test --locked --features python,svg_raster

      - name: Verify audit-contract publish package
        run: cargo publish --locked --dry-run --manifest-path crates/fullbleed_audit_contract/Cargo.toml

      - name: Inspect main crate package file set
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --list | tee target/fullbleed-package-files.txt
          test "$(wc -l < target/fullbleed-package-files.txt)" -eq 67
          ! grep -E '(^|/)(target|dist|secrets?)(/|$)|(^|/)\.env$' target/fullbleed-package-files.txt

      - name: Install declared Rust MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Compile packaged crate from a fresh consumer lockfile at MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: |
          python tools/smoke_crates_consumer.py \
            --expected-version "${{ steps.release.outputs.main_version }}" \
            --json

      - name: Retain Cargo validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crates-io-validation-${{ inputs.release_tag }}
          path: |
            target/fullbleed-package-files.txt
            crates/fullbleed_audit_contract/target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish MIT crates
    if: inputs.publish
    needs:
      - validate
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/fullbleed
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-28

      - name: Request short-lived crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish audit contract, then main crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          AUDIT_VERSION: ${{ needs.validate.outputs.audit_version }}
          MAIN_VERSION: ${{ needs.validate.outputs.main_version }}
        run: |
          set -euo pipefail

          crate_has_version() {
            curl --fail --silent --show-error \
              --user-agent "fullbleed-crates-publisher/${MAIN_VERSION}" \
              "https://crates.io/api/v1/crates/$1" |
              python -c "import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if any(v['num'] == '$2' for v in data['versions']) else 1)"
          }

          if ! crate_has_version fullbleed_audit_contract "${AUDIT_VERSION}"; then
            cargo publish --locked --registry crates-io \
              --manifest-path crates/fullbleed_audit_contract/Cargo.toml
          fi

          for attempt in {1..30}; do
            if crate_has_version fullbleed_audit_contract "${AUDIT_VERSION}"; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "fullbleed_audit_contract ${AUDIT_VERSION} did not propagate" >&2
              exit 1
            fi
            sleep 10
          done

          if ! crate_has_version fullbleed "${MAIN_VERSION}"; then
            cargo publish --locked --dry-run --registry crates-io
            cargo publish --locked --registry crates-io
          fi

          for attempt in {1..30}; do
            if crate_has_version fullbleed "${MAIN_VERSION}"; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "fullbleed ${MAIN_VERSION} did not propagate" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Confirm published MIT metadata
        shell: bash
        env:
          AUDIT_VERSION: ${{ needs.validate.outputs.audit_version }}
          MAIN_VERSION: ${{ needs.validate.outputs.main_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected = {
              "fullbleed_audit_contract": os.environ["AUDIT_VERSION"],
              "fullbleed": os.environ["MAIN_VERSION"],
          }
          headers = {"User-Agent": f"fullbleed-crates-verifier/{expected['fullbleed']}"}
          for crate, version in expected.items():
              request = urllib.request.Request(
                  f"https://crates.io/api/v1/crates/{crate}/{version}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  data = json.load(response)
              published = data["version"]
              assert published["num"] == version
              assert published["license"] == "MIT"
              assert not published["yanked"]
              print(f"{crate} {version}: MIT")
          PY
