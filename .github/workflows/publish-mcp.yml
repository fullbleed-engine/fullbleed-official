name: Publish Fullbleed MCP

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref containing the MCP package metadata"
        required: true
        type: string
        default: "v2.3.0"
      publish_pypi:
        description: "Publish fullbleed-mcp to PyPI after validation"
        required: true
        type: boolean
        default: false
      publish_registry:
        description: "Publish server.json to the preview MCP Registry"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-fullbleed-mcp-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate MCP distribution and registry metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools and public Fullbleed runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build jsonschema twine "fullbleed>=2.3.0,<3"

      - name: Resolve package metadata
        id: metadata
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("packages/fullbleed-mcp/pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check generated metadata and official server schema
        run: |
          python tools/generate_mcp_server_json.py --check --json
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request
          import jsonschema

          server = json.loads(Path("packages/fullbleed-mcp/server.json").read_text())
          request = urllib.request.Request(
              server["$schema"],
              headers={"User-Agent": "fullbleed-mcp-release-validator"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              schema = json.load(response)
          jsonschema.validate(server, schema)
          PY

      - name: Build and inspect Python distributions
        run: |
          python -m build packages/fullbleed-mcp --outdir dist
          python -m twine check dist/*
          python -m pip install --no-deps --force-reinstall dist/fullbleed_mcp-*.whl
          python tools/smoke_mcp_stdio.py --json

      - name: Upload MCP distributions
        uses: actions/upload-artifact@v7
        with:
          name: fullbleed-mcp-dists
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish fullbleed-mcp to PyPI
    if: inputs.publish_pypi
    needs: validate
    runs-on: ubuntu-latest
    environment: "pypi-mcp"
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: fullbleed-mcp-dists
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  publish-registry:
    name: Publish official MCP Registry metadata
    if: >-
      ${{
        inputs.publish_registry &&
        always() &&
        needs.validate.result == 'success' &&
        (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
      }}
    needs:
      - validate
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Wait for PyPI package metadata
        shell: bash
        env:
          MCP_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/fullbleed-mcp/${MCP_VERSION}/json" >/dev/null; then
              exit 0
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "fullbleed-mcp ${MCP_VERSION} is not available on PyPI" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install official MCP publisher
        shell: bash
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate and publish registry metadata
        shell: bash
        run: |
          ./mcp-publisher login github-oidc
          cd packages/fullbleed-mcp
          ../../mcp-publisher publish

      - name: Confirm registry discovery
        shell: bash
        run: |
          registry_json="$(curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.fullbleed-engine/fullbleed-mcp")"
          python -c '
          import json, sys
          payload = json.load(sys.stdin)
          names = {
              (item.get("server") or item).get("name")
              for item in payload.get("servers", [])
          }
          expected = "io.github.fullbleed-engine/fullbleed-mcp"
          if expected not in names:
              raise SystemExit(f"registry did not return {expected}: {sorted(name for name in names if name)}")
          print(json.dumps(payload, indent=2, sort_keys=True))
          ' <<<"${registry_json}"
