name: Print profile release gate

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Exact release commit or tag to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install external validation tools and specimen ICC
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless icc-profiles-free
          python -m pip install pypdf==6.19.0
      - name: Build and install exact release wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          subprocess.run([sys.executable, "build_backend/fullbleed_build_backend.py", "wheel", "--out", "target/pdfvt-gate-wheel"], check=True)
          wheels = list(pathlib.Path("target/pdfvt-gate-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one release wheel")
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheels[0])], check=True)
      - name: Validate all profiles, VT source assignments, and mutation controls
        run: python tools/validate_pdf_profiles.py --download-verapdf --install-pdf-oxide --strict-external --require-pdfvt-structure --out target/pdfvt-release-evidence
      - name: Retain PDFs, hashes, metadata, and raw validator reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: print-profile-release-evidence-${{ github.run_id }}
          path: target/pdfvt-release-evidence/
          if-no-files-found: error
          retention-days: 90

  dedicated-pdfvt:
    # Optional stronger evidence. Once configured, failures still block release.
    if: vars.PDFVT_VALIDATOR_RUNNER != '' && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.PDFVT_VALIDATOR_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    env:
      FULLBLEED_PDFVT_VALIDATOR_CMD: ${{ vars.PDFVT_VALIDATOR_CMD }}
      FULLBLEED_PDFVT_VALIDATOR_VERSION_CMD: ${{ vars.PDFVT_VALIDATOR_VERSION_CMD }}
      FULLBLEED_OUTPUT_INTENT_ICC: ${{ vars.PDFVT_OUTPUT_INTENT_ICC }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install release wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          subprocess.run([sys.executable, "build_backend/fullbleed_build_backend.py", "wheel", "--out", "target/pdfvt-dedicated-wheel"], check=True)
          wheels = list(pathlib.Path("target/pdfvt-dedicated-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one release wheel")
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheels[0])], check=True)
      - name: Retain dedicated validator evidence
        run: python tools/validate_pdf_profiles.py --profile pdfx4 --profile pdfvt1 --install-pdf-oxide --strict-external --require-dedicated-pdfvt --out target/pdfvt-dedicated-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dedicated-pdfvt-evidence-${{ github.run_id }}
          path: target/pdfvt-dedicated-evidence/
          if-no-files-found: error
          retention-days: 90
