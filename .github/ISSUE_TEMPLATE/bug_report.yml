name: Bug report
description: Report an engine, layout, playground, language package, CLI, or installation problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Fullbleed. For usage questions, use [Discussions](https://github.com/fullbleed-engine/fullbleed-official/discussions). Please use synthetic data and assets you can share publicly.
  - type: input
    id: version
    attributes:
      label: Fullbleed version
      description: >-
        Package version or source commit, plus the engine version if shown.
        In the playground, use the version beneath the preview. For Python, run
        `python -m fullbleed --version`.
      placeholder: Package version or source commit; engine version if shown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: >-
        Language/runtime or browser version, operating system, architecture if known,
        and installation method or page URL.
      placeholder: Chrome on Windows 11, playground; or Node.js 22 on Linux x64, npm
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        Include the steps, HTML/CSS or component source, and any command or application code needed.
        For the playground, Download project provides a ZIP you can attach after reducing it
        to synthetic data and assets you can share publicly.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual output
      description: Identify the affected page or element. Attach a PDF or screenshot for layout problems.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Include relevant error messages or browser console output. For Python,
        `python -m fullbleed doctor --json` can help. For profile issues, include
        the validator version, profile, and report if available.
