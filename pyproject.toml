[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "fullbleed"
version = "1.6.2"
description = "Deterministic static HTML/CSS-to-PDF renderer built in Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "LICENSE",
    "COPYRIGHT",
    "LICENSING.md",
    "THIRD_PARTY_LICENSES.md",
    "FONT_LICENSE_AUDIT.md",
    "FONT_LICENSE_AUDIT.json",
]
keywords = ["pdf", "html", "css", "rust", "static-pdf", "document-generation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: HTML",
]

# This is the important part: pip generates the `fullbleed` command from this
[project.scripts]
fullbleed = "fullbleed_cli.cli:main"

[project.urls]
Homepage = "https://fullbleed.dev"
Repository = "https://github.com/fullbleed-engine/fullbleed-official"
Documentation = "https://github.com/fullbleed-engine/fullbleed-official#readme"
Issues = "https://github.com/fullbleed-engine/fullbleed-official/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.maturin]
bindings = "pyo3"
features = ["python", "svg_raster"]
python-source = "python"
python-packages = ["fullbleed", "fullbleed_assets", "fullbleed_cli"]
module-name = "fullbleed._fullbleed"
include = ["python/fullbleed/**", "python/fullbleed_assets/**", "python/fullbleed_cli/**"]
strip = true

[tool.pytest.ini_options]
addopts = ["--ignore-glob=*.txt"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "target"]
